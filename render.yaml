services:
  - type: web
    name: combate-portaria-backend
    env: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgresql.prisma && npm run build
    startCommand: npx prisma db push --schema=prisma/schema.postgresql.prisma && npm run start
    healthCheckPath: /health
    disk:
      name: whatsapp-sessions
      mountPath: /var/data/whatsapp_sessions
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Cole a Connection String (Modo Transaction Pooler porta 6543) do Supabase
      - key: DIRECT_URL
        sync: false # Cole a Connection String (Modo Direct porta 5432) do Supabase
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WHATSAPP_SESSION_PATH
        value: /var/data/whatsapp_sessions
      - key: WHATSAPP_AUTO_RECONNECT
        value: "true"
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
